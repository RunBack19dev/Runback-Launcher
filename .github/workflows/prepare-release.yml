name: Prepare RunBack 19 draft release

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/request.json'

permissions:
  contents: write

concurrency:
  group: runback19-draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify launcher bundle and signed release metadata
        run: node .release/verify.cjs
      - name: Prepare draft and attach launcher assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -p "'v'+require('./.release/request.json').version")"
          if gh release view "$tag" --json isDraft > /tmp/runback-release.json 2>/dev/null; then
            node -e "if(!require('/tmp/runback-release.json').isDraft)process.exit(1)"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "RunBack 19 $tag" --notes-file .release/RELEASE_NOTES.txt
          fi
          gh release upload "$tag" .release/RunBack19-Setup.zip .release/latest.json .release/latest.json.sig --clobber
          echo 'Draft prepared. Upload every generated game payload before publishing.' >> "$GITHUB_STEP_SUMMARY"
